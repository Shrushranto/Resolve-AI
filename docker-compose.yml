services:
  db:
    image: postgres:16-alpine
    container_name: supportai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportai}
      POSTGRES_DB: ${POSTGRES_DB:-supportai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportai-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-supportai}:${POSTGRES_PASSWORD:-supportai}@db:5432/${POSTGRES_DB:-supportai}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             python data/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: supportai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
